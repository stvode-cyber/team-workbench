// 为每个 agent 加默认状态（JSON 读不到时的 fallback）
const agents = agentDefs.map(a => ({
  ...a,
  status: "idle",
  installStatus: "not-installed"  // fallback
}));

const priorityLabels = {
  "P0": { cls: "priority-p0", label: "🔴 P0 核心岗" },
  "P1": { cls: "priority-p1", label: "🟡 P1 支援岗" }
};

// ========== 扫描安装状态 JSON（带 fallback） ==========
async function loadInstallStatus() {
  try {
    const resp = await fetch('agent-install-status.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error('JSON not found');
    const data = await resp.json();

    // 更新每个 agent 的 installStatus
    Object.keys(data.agents).forEach(name => {
      const a = agents.find(x => x.en === name);
      if (a) {
        a.installStatus = data.agents[name].status;
        a.installDate = data.agents[name].installDate;
        a.agentMdExists = data.agents[name].agentMdExists;
        a.skillMdExists = data.agents[name].skillMdExists;
      }
    });

    // 更新顶栏 summary
    document.getElementById('stat-installed').firstElementChild.textContent = data.summary.installed;
    document.getElementById('stat-partial').firstElementChild.textContent = data.summary.partial;
    document.getElementById('stat-missing').firstElementChild.textContent = data.summary.missing;
    document.querySelector('.live-indicator').title = `最后扫描: ${data.summary.scannedAt}`;
  } catch (e) {
    // JSON 读不到（可能没跑过 scan）→ 全部 fallback 为 missing
    console.log('agent-install-status.json not found, using fallback (all missing)');
    document.getElementById('stat-installed').firstElementChild.textContent = 0;
    document.getElementById('stat-partial').firstElementChild.textContent = 0;
    document.getElementById('stat-missing').firstElementChild.textContent = 11;
  }
}

// ========== 渲染 ==========
function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  let html = "";

  const groups = {};
  agents.forEach(a => {
    if (!groups[a.priority]) groups[a.priority] = [];
    groups[a.priority].push(a);
  });

  Object.keys(groups).sort().forEach(p => {
    html += `<div class="group-label">${priorityLabels[p].label}<span class="count">${groups[p].length}</span></div>`;
    groups[p].forEach(a => {
      const installTitle = {
        "installed": "🟢 已完整安装",
        "partial": "🟡 不完整（SKILL.md 或 agent.md 缺失）",
        "not-installed": "🔴 未安装"
      }[a.installStatus] || "未安装";

      html += `
        <div class="agent-item" data-en="${a.en}">
          <div class="agent-avatar">${a.emoji}</div>
          <div class="agent-info">
            <div class="agent-name-row">
              <span class="agent-cn-name">${a.cn}</span>
              <span class="agent-en-name">${a.en}</span>
            </div>
            <div class="agent-desc">${a.desc}</div>
          </div>
          <div class="status-group" title="${installTitle}">
            <div class="agent-status idle" title="运行状态：待命"></div>
            <div class="install-dot ${a.installStatus}" title="${installTitle}"></div>
          </div>
        </div>
      `;
    });
  });

  sidebar.innerHTML = html;

  document.querySelectorAll(".agent-item").forEach(item => {
    item.addEventListener("click", () => {
      document.querySelectorAll(".agent-item").forEach(i => i.classList.remove("active"));
      item.classList.add("active");
      const en = item.dataset.en;
      const agent = agents.find(a => a.en === en);
      if (agent) renderDetail(agent);
    });
  });
}

function renderDetail(a) {
  const priority = priorityLabels[a.priority];
  const toolsHtml = a.tools.map(t => `<span class="tools-tag">${t}</span>`).join("");
  const whenHtml = a.when.map(w => `<li>${w}</li>`).join("");
  const processHtml = a.process.map(w => `<li>${w}</li>`).join("");
  const boundaryHtml = a.boundary.map(w => `<li>${w}</li>`).join("");

  // 触发 chip
  const h = a.howToTrigger;
  const manualHtml = h.manual.map(t => `<span class="trigger-chip manual">「${t}」</span>`).join("");
  const autoHtml = h.auto.map(t => `<span class="trigger-chip auto">🔒 ${t}</span>`).join("");

  // 调用链
  let chainHtml;
  if (a.dependsOn && a.dependsOn.length > 0) {
    chainHtml = `<div class="callchain">
      <div class="callchain-node">${a.cn}</div>
      <span class="callchain-arrow">→</span>
      ${a.dependsOn.map(name => {
        const dep = agentDefs.find(x => x.en === name);
        return `<div class="callchain-node">${dep ? dep.cn : name}</div>`;
      }).join('')}
    </div>`;
  } else {
    chainHtml = `<div class="callchain-empty">没有强制调用依赖（可以独立工作）</div>`;
  }

  // 安装区
  const installStatus = a.installStatus || "not-installed";
  const statusLabel = {
    "installed": "✅ 已完整安装",
    "partial": "⚠️ 安装不完整",
    "not-installed": "❌ 未安装"
  }[installStatus];
  const badgeClass = "badge-" + installStatus;
  const boxClass = "status-" + installStatus;

  let installDetail = "";
  if (installStatus === "installed") {
    installDetail = `<div style="font-size:11px;color:#4ade80;">安装日期：${a.installDate || "未知"}</div>
      <div style="font-size:10px;color:#8892b0;margin-top:6px;">Trae 目录已扫描验证：agent.md + SKILL.md 都在</div>`;
  } else if (installStatus === "partial") {
    const parts = [];
    if (!a.agentMdExists) parts.push("agent.md 缺失");
    if (!a.skillMdExists) parts.push("SKILL.md 缺失");
    installDetail = `<div style="font-size:11px;color:#fbbf24;">${parts.join(" + ")} — 点下面按钮重新装全</div>`;
  } else {
    installDetail = `<div style="font-size:11px;color:#f87171;">本机 Trae 目录没找到这个 Agent 的文件</div>`;
  }

  const installCmd = `powershell -ExecutionPolicy Bypass -File .\\scripts\\install-single-agent.ps1 -AgentName ${a.en}`;
  const refreshCmd = `powershell -ExecutionPolicy Bypass -File .\\scripts\\scan-install-status.ps1`;

  document.getElementById("detail").innerHTML = `
    <div class="detail-header">
      <div class="detail-avatar">${a.emoji}</div>
      <div class="detail-title">
        <h2>${a.cn}</h2>
        <span class="en-tag">${a.en}</span>
        <span class="priority-tag ${priority.cls}">${priority.label}</span>
      </div>
    </div>

    <div class="section">
      <h3>🎯 员工说明</h3>
      <div class="role-block"><p>${a.role}</p></div>
      <p style="color:#8892b0;font-size:11px;">一句话：${a.desc}</p>
    </div>

    <div class="section">
      <h3>📣 调动指引（什么时候喊我）</h3>
      <div style="margin-bottom:12px;font-size:11px;color:#8892b0;">主动触发词（你可以直接说）</div>
      <div class="trigger-chips">${manualHtml}</div>
      <div style="margin:12px 0 6px;font-size:11px;color:#8892b0;">自动触发（AI 识别到就调）</div>
      <div class="trigger-chips">${autoHtml}</div>
    </div>

    <div class="section">
      <h3>🔗 调用链（我会调谁）</h3>
      ${chainHtml}
      <div style="margin-top:10px;font-size:10px;color:#5a6a8a;">
        推演引擎 → 竞品调研员（Step 6 自动拉五张牌）· 架构师 → 接手员（先摸清家底）
      </div>
    </div>

    <div class="section">
      <h3>📋 工作流程</h3>
      <ul>${processHtml}</ul>
    </div>

    <div class="section">
      <h3>⛔ 硬性边界</h3>
      <ul>${boundaryHtml}</ul>
    </div>

    <div class="section">
      <h3>🔧 拥有工具</h3>
      <div>${toolsHtml.map(t => `<span class="tools-tag">${t}</span>`).join("")}</div>
    </div>

    <div class="section">
      <h3>📦 本机安装状态</h3>
      <div class="install-box ${boxClass}">
        <div class="install-status-line">
          <span class="install-status-badge ${badgeClass}">${statusLabel}</span>
          <span style="font-size:10px;color:#8892b0;">Trae 全局目录扫描结果</span>
        </div>
        ${installDetail}
        <div class="btn-row">
          <button class="btn primary" onclick="copyCmd('${installCmd}')">📋 复制安装命令</button>
          <button class="btn" onclick="copyCmd('${refreshCmd}')">🔄 复制重新扫描命令</button>
        </div>
        <div class="cmd-box" id="cmd-box">powershell -ExecutionPolicy Bypass -File .\\scripts\\install-single-agent.ps1 -AgentName ${a.en}</div>
      </div>
      <div style="margin-top:12px;font-size:10px;color:#5a6a8a;">
        💡 在项目根目录打开 PowerShell，粘贴上面命令回车即可安装。装完重跑 scan，面板自动刷新。
      </div>
    </div>

    <div class="section">
      <h3>📍 批量安装（11 个一起）</h3>
      <div class="btn-row">
        <button class="btn primary" onclick="copyCmd('powershell -ExecutionPolicy Bypass -File .\\scripts\\install-all-agents.ps1')">📋 一键全装命令</button>
      </div>
      <div class="cmd-box">powershell -ExecutionPolicy Bypass -File .\\scripts\\install-all-agents.ps1</div>
    </div>
  `;
}

function copyCmd(cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    alert("已复制到剪贴板：\n\n" + cmd + "\n\n在项目根目录打开 PowerShell 粘贴回车即可。");
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = cmd; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    alert("已复制（fallback）：\n\n" + cmd);
  });
}

// ========== 启动 ==========
async function init() {
  renderSidebar();
  // 默认选中第一个
  document.querySelector(".agent-item").click();
  // 异步加载安装状态（不阻塞渲染，JSON 读不到就用 fallback）
  await loadInstallStatus();
  // 重新渲染（这次用真实安装状态）
  renderSidebar();
  document.querySelector(".agent-item").click();
}
init();
